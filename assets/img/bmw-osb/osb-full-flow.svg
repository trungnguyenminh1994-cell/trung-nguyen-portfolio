  <!-- Bottom Aria Live Bridge Strip -->
  <g transform="translate(76, 672)">
    <rect width="1448" height="170" fill="#FAFAFA" stroke="#E3E3E3"/>
    <text x="28" y="38" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#2A53EE">BI-DIRECTIONAL ARIA LIVE ↔ MANUAL DRAFT SYNCHRONIZATION</text>
    <text x="28" y="64" font-family="Inter, sans-serif" font-size="14" fill="#4A4A4A">Unlike standalone chatbots that trap users in a dead end, Aria Live writes directly into BMW's shared booking draft (vehicle, BSI/CBS items, slot, pickup):</text>

    <rect x="28" y="88" width="432" height="58" fill="#FFFFFF" stroke="#E3E3E3"/>
    <text x="48" y="114" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#121212">1. Conversational Triage (Aria Live)</text>
    <text x="48" y="133" font-family="Inter, sans-serif" font-size="11" fill="#666666">Detects severity, flashes CBS card, suggests earliest slots</text>

    <line x1="460" y1="117" x2="504" y2="117" stroke="#2A53EE" stroke-width="2"/>
    <polygon points="504,112 514,117 504,122" fill="#2A53EE"/>

    <rect x="514" y="88" width="432" height="58" fill="#FFFFFF" stroke="#2A53EE" stroke-width="1.5"/>
    <text x="534" y="114" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#121212">2. Live Context Cards Beside Thread</text>
    <text x="534" y="133" font-family="Inter, sans-serif" font-size="11" fill="#666666">Vehicle card, BSI expiry, CBS due items &amp; editable Booking Summary</text>

    <line x1="946" y1="117" x2="990" y2="117" stroke="#2A53EE" stroke-width="2"/>
    <polygon points="990,112 1000,117 990,122" fill="#2A53EE"/>

    <rect x="1000" y="88" width="420" height="58" fill="#121212"/>
    <text x="1020" y="114" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3. One-Click Confirm or Manual Edit</text>
    <text x="1020" y="133" font-family="Inter, sans-serif" font-size="11" fill="#CFCFCF">Switch to Manual Booking anytime with zero lost progress</text>
  </g>
</svg>
