      <text x="20" y="110" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• Date strip + Calendar</text>
      <text x="30" y="128" font-family="Inter, sans-serif" font-size="11" fill="#666666">6-day strip &amp; full month picker</text>
      <text x="20" y="156" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• Morning / Afternoon slots</text>
      <text x="30" y="174" font-family="Inter, sans-serif" font-size="11" fill="#666666">Paginated 07:30 to 18:00 grid</text>
      <text x="20" y="202" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• Smart Fast Lane check</text>
      <text x="30" y="220" font-family="Inter, sans-serif" font-size="11" fill="#666666">Auto-disabled for cars &gt; 3 yrs</text>
      <text x="20" y="248" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• Loan Car fallback</text>
      <text x="30" y="266" font-family="Inter, sans-serif" font-size="11" fill="#666666">Conditional mobility selection</text>
      <rect x="20" y="294" width="232" height="36" fill="#FFFFFF" stroke="#E3E3E3"/>
      <text x="136" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#121212">select-appointment · rules</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(882, 0)">
      <rect width="272" height="352" fill="#FAFAFA" stroke="#E3E3E3"/>
      <rect width="272" height="5" fill="#2A53EE"/>
      <text x="20" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#2A53EE">STEP 04 · CONTACT</text>
      <text x="20" y="64" font-family="Geist, Inter, sans-serif" font-size="18" font-weight="600" fill="#121212">Driver &amp; Callback</text>
      <line x1="20" y1="82" x2="252" y2="82" stroke="#E3E3E3"/>
      <text x="20" y="110" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• Dealer assurance banner</text>
      <text x="30" y="128" font-family="Inter, sans-serif" font-size="11" fill="#666666">Dealer calls to confirm slot</text>
      <text x="20" y="156" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• Streamlined form</text>
      <text x="30" y="174" font-family="Inter, sans-serif" font-size="11" fill="#666666">Name, Mobile, Email, Address</text>
      <text x="20" y="202" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• Optional notes &amp; Co.</text>
      <text x="30" y="220" font-family="Inter, sans-serif" font-size="11" fill="#666666">Carries Aria / callback context</text>
      <text x="20" y="248" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• Persistent right summary</text>
      <text x="30" y="266" font-family="Inter, sans-serif" font-size="11" fill="#666666">Edit vehicle or services inline</text>
      <rect x="20" y="294" width="232" height="36" fill="#FFFFFF" stroke="#E3E3E3"/>
      <text x="136" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#121212">contact-details · validation</text>
    </g>

    <!-- Step 5 -->
    <g transform="translate(1176, 0)">
      <rect width="272" height="352" fill="#FAFAFA" stroke="#E3E3E3"/>
      <rect width="272" height="5" fill="#121212"/>
      <text x="20" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#121212">STEP 05 · CONFIRMATION</text>
      <text x="20" y="64" font-family="Geist, Inter, sans-serif" font-size="18" font-weight="600" fill="#121212">Confirmed &amp; Survey</text>
      <line x1="20" y1="82" x2="252" y2="82" stroke="#E3E3E3"/>
      <text x="20" y="110" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• Instant WIP booking ref</text>
      <text x="30" y="128" font-family="Inter, sans-serif" font-size="11" fill="#666666">Dealer address + date/time</text>
      <text x="20" y="156" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• Itemized service receipt</text>
      <text x="30" y="174" font-family="Inter, sans-serif" font-size="11" fill="#666666">BSI covered + Estimated total</text>
      <text x="20" y="202" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• Add To Calendar CTA</text>
      <text x="30" y="220" font-family="Inter, sans-serif" font-size="11" fill="#666666">One-tap appointment reminder</text>
      <text x="20" y="248" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• Base Survey &amp; Account</text>
      <text x="30" y="266" font-family="Inter, sans-serif" font-size="11" fill="#666666">Post-booking feedback + invite</text>
      <rect x="20" y="294" width="232" height="36" fill="#121212"/>
      <text x="136" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">confirmation · Base parity</text>
