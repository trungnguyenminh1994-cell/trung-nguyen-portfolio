      <text x="20" y="64" font-family="Geist, Inter, sans-serif" font-size="18" font-weight="600" fill="#121212">Grouped &amp; Priced</text>
      <line x1="20" y1="82" x2="252" y2="82" stroke="#E3E3E3"/>
      <text x="20" y="110" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• CBS "Due now" highlight</text>
      <text x="30" y="128" font-family="Inter, sans-serif" font-size="11" fill="#666666">Engine Oil $259 · Rear Brake $89</text>
      <text x="20" y="156" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• Battery &amp; Tyre groups</text>
      <text x="30" y="174" font-family="Inter, sans-serif" font-size="11" fill="#666666">Searchable multi-select catalog</text>
      <text x="20" y="202" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• BSI Service List modal</text>
      <text x="30" y="220" font-family="Inter, sans-serif" font-size="11" fill="#666666">Explains covered inclusions</text>
      <text x="20" y="248" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• Live Booking Summary</text>
      <text x="30" y="266" font-family="Inter, sans-serif" font-size="11" fill="#666666">Sticky sidebar + estimated total</text>
      <rect x="20" y="294" width="232" height="36" fill="#FFFFFF" stroke="#E3E3E3"/>
      <text x="136" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#121212">select-services · 17 items</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(588, 0)">
      <rect width="272" height="352" fill="#FAFAFA" stroke="#E3E3E3"/>
      <rect width="272" height="5" fill="#2A53EE"/>
      <text x="20" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#2A53EE">STEP 03 · APPOINTMENT</text>
      <text x="20" y="64" font-family="Geist, Inter, sans-serif" font-size="18" font-weight="600" fill="#121212">Slots &amp; Fast Lane</text>
