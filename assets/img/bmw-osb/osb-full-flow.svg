<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920" role="img" aria-label="BMW AU Online Service Booking Enhance and AI Integration 5-step architecture rebuilt on BMW Design System v0.2.0">
  <rect width="1600" height="920" fill="#F7F7F7"/>
  <rect x="36" y="36" width="1528" height="848" fill="#FFFFFF" stroke="#E3E3E3" stroke-width="1"/>

  <text x="76" y="88" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.06em" fill="#666666">BMW AU OSB · ENHANCE &amp; AI INTEGRATION · DESIGN SYSTEM V0.2.0 (#2A53EE · BMW TYPE NEXT PRO)</text>
  <text x="76" y="126" font-family="Geist, Inter, system-ui, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.03em" fill="#121212">From Aria Widget Concept to Complete 5-Step Online Service Booking</text>
  <line x1="76" y1="154" x2="1524" y2="154" stroke="#E3E3E3"/>

  <!-- Top Shared Bar: Persistent Dual-Mode Switcher -->
  <g transform="translate(76, 184)">
    <rect width="1448" height="68" fill="#121212"/>
    <circle cx="34" cy="34" r="14" fill="#FFFFFF"/>
    <path d="M 34 20 A 14 14 0 0 1 48 34 L 34 34 Z M 20 34 A 14 14 0 0 0 34 48 L 34 34 Z" fill="#121212"/>
    <text x="64" y="39" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">BMW AU Online Service Booking (EasyServ Shell)</text>
    <rect x="926" y="16" width="234" height="36" fill="#2A53EE"/>
    <text x="1043" y="39" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">✦ Chat With Aria (Live Sync)</text>
    <rect x="1176" y="16" width="244" height="36" fill="none" stroke="#666666"/>
    <text x="1298" y="39" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#E3E3E3">Manual 5-Step Flow · Shared Draft</text>
  </g>

  <!-- 5 OSB Step Cards -->
  <g transform="translate(76, 282)">
    <!-- Step 1 -->
    <g>
      <rect width="272" height="352" fill="#FAFAFA" stroke="#E3E3E3"/>
      <rect width="272" height="5" fill="#2A53EE"/>
      <text x="20" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#2A53EE">STEP 01 · SELECT VEHICLE</text>
      <text x="20" y="64" font-family="Geist, Inter, sans-serif" font-size="18" font-weight="600" fill="#121212">REGO, BSI &amp; Aria</text>
      <line x1="20" y1="82" x2="252" y2="82" stroke="#E3E3E3"/>
      <text x="20" y="110" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• State + REGO lookup</text>
      <text x="30" y="128" font-family="Inter, sans-serif" font-size="11" fill="#666666">DEMO01 / DEMO06 suggestions</text>
      <text x="20" y="156" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• Warning-light callback</text>
      <text x="30" y="174" font-family="Inter, sans-serif" font-size="11" fill="#666666">Photo upload → Concierge modal</text>
      <text x="20" y="202" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• Active BSI &amp; CBS cards</text>
      <text x="30" y="220" font-family="Inter, sans-serif" font-size="11" fill="#666666">Service Inclusive + 2 due items</text>
      <text x="20" y="248" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">• Aria Live chat panel</text>
      <text x="30" y="266" font-family="Inter, sans-serif" font-size="11" fill="#666666">Prefills manual steps directly</text>
      <rect x="20" y="294" width="232" height="36" fill="#FFFFFF" stroke="#E3E3E3"/>
      <text x="136" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#121212">select-vehicle · aria-chat.js</text>
    </g>

