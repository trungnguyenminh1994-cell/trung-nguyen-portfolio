<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" width="1600" height="840" role="img" aria-label="Solo AI-driven product and front-end build workflow for Zonie">
  <rect width="1600" height="840" fill="#F7F7F7"/>
  <rect x="36" y="36" width="1528" height="768" fill="#FFFFFF" stroke="#E3E3E3" stroke-width="1"/>

  <text x="76" y="88" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="0.06em" fill="#666666">SOLO PRODUCT + AI-DRIVEN FRONT-END WORKFLOW</text>
  <text x="76" y="126" font-family="Geist, Inter, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.03em" fill="#121212">How One Designer Shipped a 108-File Native iOS Front-End with AI</text>
  <line x1="76" y1="154" x2="1524" y2="154" stroke="#E3E3E3"/>

  <!-- 4 Phases -->
  <g transform="translate(76, 196)">
    <!-- Phase 1 -->
    <rect width="336" height="360" fill="#FAFAFA" stroke="#E3E3E3"/>
    <text x="24" y="38" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#666666">STAGE 01 · SOLO PRODUCT</text>
    <text x="24" y="74" font-family="Geist, Inter, sans-serif" font-size="22" font-weight="600" fill="#121212">Idea &amp; Product Spec</text>
    <line x1="24" y1="96" x2="312" y2="96" stroke="#E3E3E3"/>
    <text x="24" y="130" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#121212">• Core concept definition</text>
    <text x="36" y="152" font-family="Inter, sans-serif" font-size="12" fill="#666666">Location-anchored corkboard zones</text>
    <text x="24" y="188" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#121212">• 15-page Spec &amp; Roadmap</text>
    <text x="36" y="210" font-family="Inter, sans-serif" font-size="12" fill="#666666">Flows, data model, privacy risk</text>
    <text x="24" y="246" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#121212">• Visual dual-accent rule</text>
    <text x="36" y="268" font-family="Inter, sans-serif" font-size="12" fill="#666666">#FFB400 (you) vs #FF24BD (place)</text>
    <rect x="24" y="302" width="288" height="36" fill="#FFFFFF" stroke="#E3E3E3"/>
    <text x="168" y="324" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">Output: Zone_Spec_and_Roadmap.pdf</text>

    <!-- Connector -->
    <line x1="336" y1="180" x2="372" y2="180" stroke="#121212" stroke-width="1.5"/>
    <polygon points="372,175 382,180 372,185" fill="#121212"/>

    <!-- Phase 2 -->
    <g transform="translate(382, 0)">
      <rect width="336" height="360" fill="#FAFAFA" stroke="#E3E3E3"/>
      <text x="24" y="38" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#666666">STAGE 02 · EXECUTABLE SPEC</text>
      <text x="24" y="74" font-family="Geist, Inter, sans-serif" font-size="22" font-weight="600" fill="#121212">Interactive HTML Demo</text>
      <line x1="24" y1="96" x2="312" y2="96" stroke="#E3E3E3"/>
      <text x="24" y="130" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#121212">• Single-file vanilla JS</text>
      <text x="36" y="152" font-family="Inter, sans-serif" font-size="12" fill="#666666">Leaflet + CARTO HCMC map tiles</text>
      <text x="24" y="188" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#121212">• Tested gesture physics</text>
      <text x="36" y="210" font-family="Inter, sans-serif" font-size="12" fill="#666666">Collision avoidance, radar, Focus Mode</text>
      <text x="24" y="246" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#121212">• Zero ambiguity for AI build</text>
      <text x="36" y="268" font-family="Inter, sans-serif" font-size="12" fill="#666666">Prototype became the living contract</text>
      <rect x="24" y="302" width="288" height="36" fill="#FFFFFF" stroke="#E3E3E3"/>
      <text x="168" y="324" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">Output: 3,506-line live prototype</text>
    </g>

    <line x1="718" y1="180" x2="754" y2="180" stroke="#121212" stroke-width="1.5"/>
    <polygon points="754,175 764,180 754,185" fill="#121212"/>

    <!-- Phase 3 -->
    <g transform="translate(764, 0)">
      <rect width="336" height="360" fill="#121212"/>
      <text x="24" y="38" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#FFB400">STAGE 03 · AI-BUILT NATIVE FE</text>
      <text x="24" y="74" font-family="Geist, Inter, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">Task Split &amp; SwiftUI</text>
      <line x1="24" y1="96" x2="312" y2="96" stroke="#333333"/>
      <text x="24" y="130" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">• 21 scoped feature plans</text>
      <text x="36" y="152" font-family="Inter, sans-serif" font-size="12" fill="#A4A4A4">Camera, Music, Chat, Private, Brushes</text>
      <text x="24" y="188" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">• Strict AI coding rules</text>
      <text x="36" y="210" font-family="Inter, sans-serif" font-size="12" fill="#A4A4A4">Token lock, changelog per round</text>
      <text x="24" y="246" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">• 163 iterative rounds</text>
      <text x="36" y="268" font-family="Inter, sans-serif" font-size="12" fill="#A4A4A4">Real hardware camera + CoreLocation</text>
      <rect x="24" y="302" width="288" height="36" fill="#FFB400"/>
      <text x="168" y="324" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#2B1D00">Output: 108 Native SwiftUI Files</text>
    </g>

    <line x1="1100" y1="180" x2="1136" y2="180" stroke="#121212" stroke-width="1.5"/>
    <polygon points="1136,175 1146,180 1136,185" fill="#121212"/>

    <!-- Phase 4 -->
    <g transform="translate(1146, 0)">
      <rect width="302" height="360" fill="#FAFAFA" stroke="#E3E3E3"/>
      <text x="24" y="38" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#666666">STAGE 04 · QUALITY GATE</text>
      <text x="24" y="74" font-family="Geist, Inter, sans-serif" font-size="22" font-weight="600" fill="#121212">Audit &amp; Ready for BE</text>
      <line x1="24" y1="96" x2="278" y2="96" stroke="#E3E3E3"/>
      <text x="24" y="130" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#121212">• 255 automated tests</text>
      <text x="36" y="152" font-family="Inter, sans-serif" font-size="12" fill="#666666">18 XCTest suites across state</text>
      <text x="24" y="188" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#121212">• Repository boundary</text>
      <text x="36" y="210" font-family="Inter, sans-serif" font-size="12" fill="#666666">Zero UI rewrite when BE connects</text>
      <text x="24" y="246" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#121212">• Thermal &amp; WCAG AA</text>
      <text x="36" y="268" font-family="Inter, sans-serif" font-size="12" fill="#666666">Profiled on iPhone 14 Plus</text>
      <rect x="24" y="302" width="254" height="36" fill="#FFFFFF" stroke="#E3E3E3"/>
      <text x="151" y="324" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#121212">Phase 0 Closed · Backend Ready</text>
    </g>
  </g>

  <!-- Bottom Architecture Bridge Strip -->
  <g transform="translate(76, 608)">
    <rect width="1448" height="156" fill="#FAFAFA" stroke="#E3E3E3"/>
    <text x="32" y="42" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#666666">CLEAN FRONT-END TO BACK-END ARCHITECTURE BRIDGE (OFFLINE-FIRST / UI-FIRST)</text>
    <rect x="32" y="64" width="240" height="60" fill="#FFFFFF" stroke="#121212" stroke-width="1.5"/>
    <text x="152" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#121212">SwiftUI Views + DS</text>
    <text x="152" y="109" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#666666">Zero native chrome</text>

    <line x1="272" y1="94" x2="328" y2="94" stroke="#121212" stroke-width="1.5"/>
    <rect x="328" y="64" width="240" height="60" fill="#FFFFFF" stroke="#121212" stroke-width="1.5"/>
    <text x="448" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#121212">Single AppStore</text>
    <text x="448" y="109" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#666666">Live-preview + commit</text>

    <line x1="568" y1="94" x2="624" y2="94" stroke="#121212" stroke-width="1.5"/>
    <rect x="624" y="64" width="268" height="60" fill="#FFB400"/>
    <text x="758" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#2B1D00">Repository Protocols</text>
    <text x="758" y="109" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#2B1D00">DTO round-trip verified</text>

    <line x1="892" y1="94" x2="948" y2="94" stroke="#121212" stroke-width="1.5" stroke-dasharray="5 5"/>
    <rect x="948" y="64" width="220" height="60" fill="#FFFFFF" stroke="#E3E3E3"/>
    <text x="1058" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#121212">NOW: Mock Services</text>
    <text x="1058" y="109" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#666666">Klipy + Openverse live</text>

    <line x1="1168" y1="94" x2="1208" y2="94" stroke="#121212" stroke-width="1.5" stroke-dasharray="5 5"/>
    <rect x="1208" y="64" width="208" height="60" fill="#FFFFFF" stroke="#E3E3E3"/>
    <text x="1312" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#121212">NEXT: Real Backend</text>
    <text x="1312" y="109" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#666666">Auth · PostGIS · Realtime</text>
  </g>
</svg>
