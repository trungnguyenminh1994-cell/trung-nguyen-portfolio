<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05142e"/><stop offset="1" stop-color="#000306"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="300" height="200" fill="url(#g)"/>
  <!-- tacho arc -->
  <g filter="url(#glow)" fill="none" stroke="#2f9bff" stroke-width="3" stroke-linecap="round">
    <path d="M40 180 A110 110 0 0 1 60 42"/>
  </g>
  <g stroke="#2f9bff" stroke-width="2.5" stroke-linecap="round" opacity=".85">
    <path d="M26 150 h14"/><path d="M28 124 h14"/><path d="M36 100 h14"/><path d="M50 78 h14"/>
  </g>
  <text x="62" y="112" font-family="Helvetica,Arial" font-size="30" fill="#2f9bff" filter="url(#glow)">10</text>
  <text x="46" y="140" font-family="Helvetica,Arial" font-size="11" fill="#7fc4ff">1/min</text>
  <text x="48" y="152" font-family="Helvetica,Arial" font-size="11" fill="#7fc4ff">x100</text>
  <!-- red needle -->
  <g filter="url(#glow)"><path d="M58 186 L252 128" stroke="#ff2d17" stroke-width="5" stroke-linecap="round"/></g>
  <!-- ABS -->
  <text x="118" y="72" font-family="Helvetica,Arial" font-weight="bold" font-size="20" fill="#f5a623" filter="url(#glow)">ABS</text>
  <!-- engine icon -->
  <g filter="url(#glow)" fill="none" stroke="#f5a623" stroke-width="2.6" stroke-linejoin="round">
    <path d="M214 38 h10 v-7 h12 v7 h8 l7 -6 v10 h7 v12 h-7 v10 l-7 -6 h-8 v7 h-22 v-7 h-6 v-10 h-6 v-12 h6 v-5 h6 z"/>
  </g>
  <!-- brake / circle A -->
  <g filter="url(#glow)" stroke="#f5a623" stroke-width="2.6" fill="none">
    <circle cx="200" cy="112" r="14"/><path d="M194 119 l6 -14 l6 14"/><path d="M196.5 114 h7"/>
    <path d="M188 100 a16 16 0 0 1 24 -2" stroke-width="2"/><path d="M186 96 l3 6 l6 -3"/>
  </g>
  <!-- seatbelt -->
  <g filter="url(#glow)" stroke="#ff4b2b" stroke-width="2.4" fill="none">
    <circle cx="256" cy="164" r="4"/><path d="M250 172 l12 -2 M248 178 h16 M252 170 l-3 9"/>
  </g>
</svg>
